# YOLOv7-RCSOSA 注意力机制模型 高性能GPU训练超参数配置
# 适用于: train-rcsosa.py
# 模型特点: 包含RCSOSA注意力机制，增强特征提取能力
# GPU训练优化: 充分发挥注意力机制优势，追求最高精度

lr0: 0.01  # 初始学习率 (GPU训练可用标准学习率)
lrf: 0.01    # 最终学习率比例 (低收敛获得更高精度)
momentum: 0.937  # SGD动量
weight_decay: 0.0005  # 权重衰减
warmup_epochs: 5.0  # 预热轮数 (注意力机制需要更长预热)
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1  # 预热偏置学习率

# 损失函数权重 - RCSOSA注意力机制GPU优化
box: 0.05  # 边界框损失
cls: 0.6    # 分类损失 (注意力机制可大幅提升分类能力)
obj: 1.0    # 目标检测损失 (最大化检测精度)
cls_pw: 1.0  # 分类正样本权重
obj_pw: 1.0  # 目标正样本权重
iou_t: 0.20  # IoU训练阈值
anchor_t: 4.0  # anchor倍数阈值

# Focal Loss
fl_gamma: 0.0  # focal loss gamma

# 数据增强参数 - 注意力机制GPU优化
hsv_h: 0.015  # HSV色调增强 (注意力机制对细微特征敏感)
hsv_s: 0.7   # HSV饱和度增强
hsv_v: 0.4   # HSV亮度增强
degrees: 0.0  # 图像旋转角度
translate: 0.1  # 图像平移
scale: 0.5    # 图像缩放 (增大缩放范围发挥注意力优势)
shear: 0.0     # 图像剪切
perspective: 0.0  # 透视变换
flipud: 0.0    # 上下翻转
fliplr: 0.5    # 左右翻转
mosaic: 1.0    # 马赛克增强 (注意力机制适合复杂场景)
mixup: 0.15    # 图像混合 (适度混合有助于注意力学习)
copy_paste: 0.1  # 复制粘贴增强
paste_in: 0.0   # 粘贴增强

# 损失计算优化
loss_ota: 1  # 使用OTA损失 (注意力机制与OTA配合提升精度)
