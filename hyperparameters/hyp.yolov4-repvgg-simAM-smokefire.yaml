# YOLOv4-RepVGG-SimAM超参数配置 - 基于smokefire数据集优化
# RepVGG + SimAM：训练推理效率 + 无参数注意力
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注

# 学习率配置 (RepVGG + SimAM优化)
lr0: 0.012         # RepVGG+SimAM协同优势
lrf: 0.2           # RepVGG收敛特性

# 优化器参数 (RepVGG + SimAM优化)
momentum: 0.937     # SGD动量
weight_decay: 0.0005  # 权重衰减

# RepVGG + SimAM特定优化
warmup_epochs: 5.0    # RepVGG需要更长预热
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 增强参数 (RepVGG + SimAM适配fire/smoke)
hsv_h: 0.025       # RepVGG+SimAM颜色鲁棒性
hsv_s: 0.7         # 饱和度增强
hsv_v: 0.4         # 亮度增强
degrees: 5.0       # RepVGG+SimAM形状适应性
translate: 0.12    # 平移增强
scale: 0.6         # 尺度变化
shear: 2.0         # 剪切变换能力强
perspective: 0.0001  # 微小透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.18        # RepVGG+SimAM适合强mixup
copy_paste: 0.0    # copy-paste

# 损失权重 (RepVGG + SimAM+类别不平衡优化)
box: 0.05          # box损失
cls: 0.26          # RepVGG+SimAM分类强，显著降低权重
cls_pw: 1.0        # 分类正权重
obj: 1.25          # 目标性损失适度增强
obj_pw: 1.0        # 目标性正权重
iou_t: 0.17        # 降低IoU阈值，增加正样本
anchor_t: 3.5      # 降低锚点阈值适配小目标
fl_gamma: 0.7      # 强化焦点损失适配组合

# RepVGG + SimAM特定参数
img_size: 640      # 训练图像尺寸

# 针对RepVGG + SimAM的训练策略
# RepVGG提供训练推理效率，SimAM提供无参数注意力
# 组合优势：高效注意力 + 快速推理
# 适合实时fire/smoke检测场景
