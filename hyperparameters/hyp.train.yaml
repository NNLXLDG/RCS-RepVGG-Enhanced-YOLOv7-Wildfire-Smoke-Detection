# YOLOv7 标准模型 高性能GPU训练超参数配置
# 适用于: train.py
# 模型特点: 标准架构，平衡精度和速度
# GPU训练优化: 最大化模型性能和训练效率

lr0: 0.01  # 初始学习率 - GPU训练可用标准学习率
lrf: 0.01  # 最终学习率比例 (更低的最终学习率获得更好收敛)
momentum: 0.937  # SGD动量
weight_decay: 0.0005  # 优化器权重衰减
warmup_epochs: 3.0  # 预热轮数
warmup_momentum: 0.8  # 预热初始动量
warmup_bias_lr: 0.1  # 预热初始偏置学习率

# 损失函数权重 - 针对火灾烟雾检测优化
box: 0.05  # 边界框损失权重
cls: 0.5   # 分类损失权重 - 提高分类精度
obj: 1.0   # 目标检测损失权重 - 最大化检测精度
cls_pw: 1.0  # 分类BCE损失正样本权重
obj_pw: 1.0  # 目标BCE损失正样本权重
iou_t: 0.20  # IoU训练阈值
anchor_t: 4.0  # anchor倍数阈值

# Focal Loss (用于处理正负样本不平衡)
fl_gamma: 0.0  # focal loss gamma参数

# 数据增强参数 - GPU高性能训练优化
hsv_h: 0.015  # HSV色调增强
hsv_s: 0.7    # HSV饱和度增强
hsv_v: 0.4    # HSV亮度增强
degrees: 0.0  # 图像旋转角度 (火灾场景特定)
translate: 0.1  # 图像平移比例
scale: 0.5     # 图像缩放增益 (增大缩放范围提升泛化)
shear: 0.0     # 图像剪切角度
perspective: 0.0  # 透视变换
flipud: 0.0    # 上下翻转概率 (火灾场景不适合)
fliplr: 0.5    # 左右翻转概率
mosaic: 1.0    # 马赛克增强概率
mixup: 0.0     # 图像混合概率 (关闭以提升训练稳定性)
copy_paste: 0.1  # 复制粘贴增强概率
paste_in: 0.0    # 粘贴增强概率

# 损失计算优化
loss_ota: 1  # 使用OTA损失计算 (提升训练精度)
