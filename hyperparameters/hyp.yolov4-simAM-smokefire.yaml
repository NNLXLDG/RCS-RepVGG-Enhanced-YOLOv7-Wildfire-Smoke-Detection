# YOLOv4-SimAM超参数配置 - 基于smokefire数据集优化
# SimAM：Parameter-free注意力机制，无额外参数开销
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注

# 学习率配置 (SimAM优化)
lr0: 0.01          # SimAM无参数开销，标准学习率
lrf: 0.15          # SimAM稳定收敛

# 优化器参数 (SimAM适配)
momentum: 0.937     # SGD动量
weight_decay: 0.0005  # SimAM无额外参数，标准权重衰减

# SimAM特定优化
warmup_epochs: 3.5    # SimAM快速激活，适中预热
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 增强参数 (SimAM适配fire/smoke)
hsv_h: 0.02        # 色调变化
hsv_s: 0.7         # 饱和度增强
hsv_v: 0.4         # 亮度增强
degrees: 3.0       # 适度旋转
translate: 0.1     # 平移增强
scale: 0.55        # 尺度变化
shear: 1.0         # 轻微剪切
perspective: 0.0001  # 微小透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.1         # SimAM适配mixup
copy_paste: 0.0    # copy-paste

# 损失权重 (SimAM+类别不平衡优化)
box: 0.05          # box损失
cls: 0.32          # SimAM空间注意力，适度降低分类权重
cls_pw: 1.0        # 分类正权重
obj: 1.2           # 目标性损失增强
obj_pw: 1.0        # 目标性正权重
iou_t: 0.18        # 略降IoU阈值，增加正样本
anchor_t: 3.7      # 适度降低锚点阈值
fl_gamma: 0.65     # 焦点损失适配SimAM注意力机制

# SimAM特定参数
img_size: 640      # 训练图像尺寸

# 针对SimAM的训练策略
# SimAM是parameter-free的注意力机制，计算效率高
# 适合fire/smoke检测中的空间注意力增强
# 无额外参数，不增加模型复杂度
