# YOLOv7-RepVGG+RCSOSA 混合架构 高性能GPU训练超参数配置
# 适用于: train-repvgg-rcsosa.py  
# 模型特点: 结合RepVGG重参数化和RCSOSA注意力机制
# GPU训练优化: 最强架构组合，追求极致精度

lr0: 0.01  # 初始学习率 (GPU训练标准学习率)
lrf: 0.01    # 最终学习率比例 (极低收敛获得极致精度)
momentum: 0.937  # SGD动量
weight_decay: 0.0005  # 权重衰减
warmup_epochs: 6.0  # 预热轮数 (混合架构需要更长预热)
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1  # 预热偏置学习率

# 损失函数权重 - 混合架构GPU极致优化
box: 0.05  # 边界框损失
cls: 0.8   # 分类损失 (混合架构分类能力极强)
obj: 1.0   # 目标检测损失 (最大化检测精度)
cls_pw: 1.0  # 分类正样本权重
obj_pw: 1.0  # 目标正样本权重
iou_t: 0.20  # IoU训练阈值
anchor_t: 4.0  # anchor倍数阈值

# Focal Loss
fl_gamma: 0.0  # focal loss gamma

# 数据增强参数 - 混合架构GPU优化策略
hsv_h: 0.015  # HSV色调增强
hsv_s: 0.7   # HSV饱和度增强
hsv_v: 0.4   # HSV亮度增强
degrees: 0.0  # 图像旋转角度
translate: 0.1  # 图像平移
scale: 0.5     # 图像缩放 (大缩放范围发挥混合架构优势)
shear: 0.0     # 图像剪切
perspective: 0.0  # 透视变换
flipud: 0.0    # 上下翻转
fliplr: 0.5    # 左右翻转
mosaic: 1.0    # 马赛克增强 (混合架构最适合复杂场景)
mixup: 0.2    # 图像混合 (充分发挥混合架构学习能力)
copy_paste: 0.1  # 复制粘贴增强
paste_in: 0.0   # 粘贴增强

# 损失计算优化
loss_ota: 1  # 使用OTA损失 (混合架构与OTA完美配合)


