# YOLOv7-Tiny 轻量级模型 高性能GPU训练超参数配置
# 适用于: train-tiny.py
# 模型特点: 轻量级架构，快速训练和推理
# GPU训练优化: 最大化训练精度，保持速度优势

lr0: 0.01  # 初始学习率 - Tiny模型GPU训练可用标准学习率
lrf: 0.01   # 最终学习率比例 (更低收敛获得更高精度)
momentum: 0.937  # SGD动量
weight_decay: 0.0005  # 权重衰减
warmup_epochs: 3.0  # 预热轮数
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1  # 预热偏置学习率

# 损失函数权重 - Tiny模型GPU优化
box: 0.05  # 边界框损失权重
cls: 0.5   # 分类损失权重 (GPU训练可提高分类精度要求)
obj: 1.0   # 目标检测损失权重 (最大化检测精度)
cls_pw: 1.0  # 分类正样本权重
obj_pw: 1.0  # 目标正样本权重
iou_t: 0.20  # IoU训练阈值
anchor_t: 4.0  # anchor倍数阈值

# Focal Loss
fl_gamma: 0.0  # focal loss gamma

# 数据增强参数 - Tiny模型GPU优化策略
hsv_h: 0.015   # HSV色调增强
hsv_s: 0.7     # HSV饱和度增强
hsv_v: 0.4     # HSV亮度增强
degrees: 0.0   # 图像旋转角度
translate: 0.1  # 图像平移
scale: 0.5     # 图像缩放 (增大缩放范围)
shear: 0.0     # 图像剪切
perspective: 0.0  # 透视变换
flipud: 0.0    # 上下翻转
fliplr: 0.5    # 左右翻转
mosaic: 1.0    # 马赛克增强 (GPU训练可全开)
mixup: 0.0     # 图像混合 (关闭以保持训练稳定)
copy_paste: 0.1  # 复制粘贴增强
paste_in: 0.0    # 粘贴增强

# 损失计算优化 - Tiny模型GPU专用
loss_ota: 1  # 开启OTA损失提升精度
