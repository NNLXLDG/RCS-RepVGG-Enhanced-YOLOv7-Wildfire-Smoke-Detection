# YOLOv4-RCSOSA-SimAM超参数配置 - 基于smokefire数据集优化
# RCSOSA + SimAM：增强特征提取 + 无参数注意力
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注

# 学习率配置 (RCSOSA + SimAM优化)
lr0: 0.01          # RCSOSA+SimAM协同平衡
lrf: 0.12          # RCSOSA特征重用特性

# 优化器参数 (RCSOSA + SimAM优化)
momentum: 0.937     # SGD动量
weight_decay: 0.0004  # RCSOSA权重衰减优化

# RCSOSA + SimAM特定优化
warmup_epochs: 4.0    # 适中预热时间
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 增强参数 (RCSOSA + SimAM适配fire/smoke)
hsv_h: 0.02        # 色调变化
hsv_s: 0.75        # RCSOSA对饱和度敏感
hsv_v: 0.45        # 亮度增强
degrees: 4.0       # 适度旋转
translate: 0.1     # 平移增强
scale: 0.55        # 尺度变化
shear: 1.5         # 适度剪切
perspective: 0.0001  # 微小透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.12        # RCSOSA+SimAM适配mixup
copy_paste: 0.0    # copy-paste

# 损失权重 (RCSOSA + SimAM+类别不平衡优化)
box: 0.05          # box损失
cls: 0.3           # 特征丰富+注意力，进一步降低分类权重
cls_pw: 1.0        # 分类正权重
obj: 1.25          # 目标性损失增强
obj_pw: 1.0        # 目标性正权重
iou_t: 0.24        # 精确定位能力强，更高IoU要求
anchor_t: 3.8      # 略降锚点阈值
fl_gamma: 0.75     # 焦点损失适配组合

# RCSOSA + SimAM特定参数
img_size: 640      # 训练图像尺寸

# 针对RCSOSA + SimAM的训练策略
# RCSOSA提供丰富特征，SimAM提供高效空间注意力
# 组合优势：丰富特征表示 + 空间注意力增强
# 适合复杂fire/smoke形状检测
