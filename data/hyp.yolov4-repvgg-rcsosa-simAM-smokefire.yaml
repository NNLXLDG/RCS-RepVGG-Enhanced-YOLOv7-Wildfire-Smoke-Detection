# YOLOv4-RepVGG-RCSOSA-SimAM超参数配置 - 基于smokefire数据集优化
# RepVGG + RCSOSA + SimAM：终极三重组合架构
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注

# 学习率配置 (终极三重组合优化)
lr0: 0.012         # 三重架构协同优势
lrf: 0.2           # 终极组合收敛能力

# 优化器参数 (终极三重组合优化)
momentum: 0.937     # SGD动量
weight_decay: 0.00045  # 平衡的权重衰减

# RepVGG + RCSOSA + SimAM特定优化
warmup_epochs: 5.5    # 复杂架构需要充分预热
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 增强参数 (终极三重组合适配fire/smoke)
hsv_h: 0.03        # 最强颜色鲁棒性
hsv_s: 0.75        # 饱和度增强
hsv_v: 0.45        # 亮度增强
degrees: 6.0       # 最强旋转适应性
translate: 0.12    # 平移增强
scale: 0.65        # 最大尺度变化适应
shear: 2.5         # 最强形变处理
perspective: 0.0001  # 微小透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.2         # 三重架构支持最强mixup
copy_paste: 0.0    # copy-paste

# 损失权重 (终极三重组合+类别不平衡优化)
box: 0.05          # box损失
cls: 0.25          # 三重架构分类能力最强，最低分类权重
cls_pw: 1.0        # 分类正权重
obj: 1.35          # 最强目标性损失
obj_pw: 1.0        # 目标性正权重
iou_t: 0.27        # 最高精度定位要求
anchor_t: 3.2      # 最低锚点阈值，最适合小目标
fl_gamma: 0.9      # 最强焦点损失配置

# 终极三重组合特定参数
img_size: 640      # 训练图像尺寸

# 针对RepVGG + RCSOSA + SimAM的训练策略
# 三种技术的完美结合:
# - RepVGG: 训练推理效率优化
# - RCSOSA: 增强特征提取能力  
# - SimAM: 无参数空间注意力
# 终极性能与效率的完美平衡
