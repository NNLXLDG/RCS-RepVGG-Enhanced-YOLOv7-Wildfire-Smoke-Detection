# YOLOv4-CSP-IDetect超参数配置 - 基于smokefire数据集优化
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注
# 图像尺寸: 640x640, 平均每张图像1.99个标注

# 学习率配置 (基础CSP优化)
lr0: 0.01          # 初始学习率
lrf: 0.15          # 最终学习率比例 (基础模型稳定收敛)

# 优化器参数
momentum: 0.937     # SGD动量
weight_decay: 0.0005  # 权重衰减

# 增强参数 (fire/smoke检测优化)
hsv_h: 0.02        # 色调变化 (火焰烟雾颜色多样性)
hsv_s: 0.7         # 饱和度增强
hsv_v: 0.4         # 亮度增强 (适应不同光照条件)
degrees: 3.0       # 轻微旋转 (火焰形状变化)
translate: 0.1     # 平移增强
scale: 0.6         # 尺度变化 (适应不同大小火源)
shear: 1.0         # 轻微剪切
perspective: 0.0001  # 微小透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.1         # 适度mixup
copy_paste: 0.0    # copy-paste

# 损失权重 (类别不平衡优化: smoke:fire=2.17:1)
box: 0.05          # box损失增益
cls: 0.3           # 分类损失 (进一步降低以适应严重不平衡)
cls_pw: 1.0        # 分类正权重
obj: 1.3           # 目标性损失 (提高小目标检测)
obj_pw: 1.0        # 目标性正权重
iou_t: 0.20        # IoU训练阈值
anchor_t: 3.5      # 锚点倍数阈值 (适当降低以匹配小目标)
fl_gamma: 0.7      # 焦点损失gamma (增强缓解类别不平衡)

# 图像尺寸配置
img_size: 640      # 训练图像尺寸

# 数据集特定优化
# 基于分析结果优化:
# - 类别不平衡(smoke:fire = 2.17:1)，调整cls权重
# - 小目标较多，调整obj权重
# - 目标密度适中(每图1.99个)
warmup_epochs: 3.0    # 预热轮次
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 针对fire/smoke检测的特殊配置
# fire类别通常较小，smoke类别可能较大且不规则
# anchor_t和iou_t已在上面定义，这里是说明性注释
