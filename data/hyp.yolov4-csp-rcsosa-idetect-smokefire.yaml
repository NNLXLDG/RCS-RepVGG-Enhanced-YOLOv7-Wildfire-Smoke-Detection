# YOLOv4-CSP-RCSOSA-IDetect超参数配置 - 基于smokefire数据集优化
# RCS-OSA模块提供增强的特征提取能力
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注

# 学习率配置 (RCS-OSA优化)
lr0: 0.008         # 稍低初始学习率(RCS-OSA特征复杂)
lrf: 0.1           # 标准最终学习率

# 优化器参数 (RCS-OSA优化)
momentum: 0.937     # SGD动量
weight_decay: 0.0005  # 权重衰减

# RCS-OSA特定优化
warmup_epochs: 3.0    # 标准预热
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 增强参数 (RCS-OSA适配)
hsv_h: 0.015       # 色调变化
hsv_s: 0.7         # 饱和度增强
hsv_v: 0.4         # 亮度增强
degrees: 0.0       # 不使用旋转(保持特征稳定)
translate: 0.1     # 平移增强
scale: 0.5         # 尺度变化
shear: 0.0         # 不使用剪切
perspective: 0.0   # 透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.0         # 不使用mixup(保持特征纯度)
copy_paste: 0.0    # copy-paste

# 损失权重 (RCS-OSA优化)
box: 0.05          # box损失
cls: 0.5           # 分类损失(标准权重)
cls_pw: 1.0        # 分类正权重
obj: 1.2           # 稍高目标性损失(RCS-OSA特征丰富)
obj_pw: 1.0        # 目标性正权重
iou_t: 0.20        # IoU阈值
anchor_t: 4.0      # 锚点阈值
fl_gamma: 0.0      # 焦点损失gamma

# RCS-OSA特定参数
img_size: 640      # 训练图像尺寸

# 针对RCS-OSA的训练策略
# RCS-OSA模块增强特征提取能力，适合复杂场景
# 对fire/smoke的不规则形状有更好的适应性
