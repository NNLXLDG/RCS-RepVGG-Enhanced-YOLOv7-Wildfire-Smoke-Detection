# YOLOv4-CSP-RepVGG-RCSOSA-IDetect超参数配置 - 基于smokefire数据集优化
# 结合RepVGG和RCS-OSA模块的混合架构
# 数据集信息: 2类 (fire, smoke), 9087张图像, 18092个标注

# 学习率配置 (混合架构优化)
lr0: 0.009         # 平衡的初始学习率
lrf: 0.15          # 平衡的最终学习率

# 优化器参数 (混合架构优化)
momentum: 0.937     # SGD动量
weight_decay: 0.0005  # 权重衰减

# 混合架构特定优化
warmup_epochs: 4.0    # 中等预热时间
warmup_momentum: 0.8  # 预热动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# 增强参数 (混合架构适配)
hsv_h: 0.018       # 适度色调变化
hsv_s: 0.7         # 饱和度增强
hsv_v: 0.4         # 亮度增强
degrees: 2.0       # 轻微旋转
translate: 0.1     # 平移增强
scale: 0.5         # 尺度变化
shear: 1.0         # 轻微剪切
perspective: 0.0   # 透视变换
flipud: 0.0        # 上下翻转
fliplr: 0.5        # 左右翻转
mosaic: 1.0        # mosaic增强
mixup: 0.1         # 适度mixup(平衡两种架构)
copy_paste: 0.0    # copy-paste

# 损失权重 (混合架构优化)
box: 0.05          # box损失
cls: 0.4           # 平衡的分类损失
cls_pw: 1.0        # 分类正权重
obj: 1.1           # 适度目标性损失
obj_pw: 1.0        # 目标性正权重
iou_t: 0.20        # IoU阈值
anchor_t: 4.0      # 锚点阈值
fl_gamma: 0.0      # 焦点损失gamma

# 混合架构特定参数
img_size: 640      # 训练图像尺寸

# 针对RepVGG+RCS-OSA混合架构的训练策略
# 结合RepVGG的训练-推理效率和RCS-OSA的特征提取能力
# 在精度和速度之间取得最佳平衡
