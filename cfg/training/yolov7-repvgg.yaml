# YOLOv7 with RepVGG modules optimization

# parameters
nc: 2 # number of classes
depth_multiple: 1.0 # model depth multiple
width_multiple: 1.0 # layer channel multiple


# anchors - 根据论文更新 (使用K-means聚类生成的4个锚点尺度)
anchors:
  - [87, 90, 127, 139] # P4/16 
  - [154, 171, 191, 240] # P5/32



# yolov7-repvgg backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, RepVGG, [32, 3, 1]], # 0

    [-1, 1, RepVGG, [64, 3, 2]], # 1-P1/2
    [-1, 1, RepVGG, [64, 3, 1]],

    [-1, 1, RepVGG, [128, 3, 2]], # 3-P2/4
    [-1, 1, Conv, [64, 1, 1]],
    [-2, 1, Conv, [64, 1, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [[-1, -3, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [256, 1, 1]], # 11

    [-1, 1, MP, []],
    [-1, 1, Conv, [128, 1, 1]],
    [-3, 1, Conv, [128, 1, 1]],
    [-1, 1, RepVGG, [128, 3, 2]],
    [[-1, -3], 1, Concat, [1]], # 16-P3/8
    [-1, 1, Conv, [128, 1, 1]],
    [-2, 1, Conv, [128, 1, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [[-1, -3, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [512, 1, 1]], # 24

    [-1, 1, MP, []],
    [-1, 1, Conv, [256, 1, 1]],
    [-3, 1, Conv, [256, 1, 1]],
    [-1, 1, RepVGG, [256, 3, 2]],
    [[-1, -3], 1, Concat, [1]], # 29-P4/16
    [-1, 1, Conv, [256, 1, 1]],
    [-2, 1, Conv, [256, 1, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [[-1, -3, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [1024, 1, 1]], # 37

    [-1, 1, MP, []],
    [-1, 1, Conv, [512, 1, 1]],
    [-3, 1, Conv, [512, 1, 1]],
    [-1, 1, RepVGG, [512, 3, 2]],
    [[-1, -3], 1, Concat, [1]], # 42-P5/32
    [-1, 1, Conv, [256, 1, 1]],
    [-2, 1, Conv, [256, 1, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [[-1, -3, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [1024, 1, 1]], # 50
  ]

# yolov7-repvgg head
head: [
    [-1, 1, SPPCSPC, [512]], # 51

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [37, 1, Conv, [256, 1, 1]], # route backbone P4
    [[-1, -2], 1, Concat, [1]],

    [-1, 1, Conv, [256, 1, 1]],
    [-2, 1, Conv, [256, 1, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [256, 1, 1]], # 63

    [-1, 1, Conv, [128, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [24, 1, Conv, [128, 1, 1]], # route backbone P3
    [[-1, -2], 1, Concat, [1]],

    [-1, 1, Conv, [128, 1, 1]],
    [-2, 1, Conv, [128, 1, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [-1, 1, RepVGG, [64, 3, 1]],
    [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [128, 1, 1]], # 75

    [-1, 1, MP, []],
    [-1, 1, Conv, [128, 1, 1]],
    [-3, 1, Conv, [128, 1, 1]],
    [-1, 1, RepVGG, [128, 3, 2]],
    [[-1, -3, 63], 1, Concat, [1]],

    [-1, 1, Conv, [256, 1, 1]],
    [-2, 1, Conv, [256, 1, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [-1, 1, RepVGG, [128, 3, 1]],
    [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [256, 1, 1]], # 88

    [-1, 1, MP, []],
    [-1, 1, Conv, [256, 1, 1]],
    [-3, 1, Conv, [256, 1, 1]],
    [-1, 1, RepVGG, [256, 3, 2]],
    [[-1, -3, 51], 1, Concat, [1]],

    [-1, 1, Conv, [512, 1, 1]],
    [-2, 1, Conv, [512, 1, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [-1, 1, RepVGG, [256, 3, 1]],
    [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
    [-1, 1, Conv, [512, 1, 1]], # 101

    # 根据论文减少检测头 (从3个减少到2个)
    [88, 1, RepVGG, [512, 3, 1]],
    [101, 1, RepVGG, [1024, 3, 1]],

    [[103, 104], 1, IDetect, [nc, anchors]], # Detect(P4, P5) - 仅使用两个特征层
  ]
