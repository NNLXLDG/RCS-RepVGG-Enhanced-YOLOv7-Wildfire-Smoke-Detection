# YOLOv7 with RepVGG and RCSOSA modules optimization

# parameters
nc: 2 # number of classes
depth_multiple: 1.0 # model depth multiple
width_multiple: 1.0 # layer channel multiple

# anchors
anchors:
  - [12, 16, 19, 36, 40, 28] # P3/8
  - [36, 75, 76, 55, 72, 146] # P4/16
  - [142, 110, 192, 243, 459, 401] # P5/32

# yolov7 backbone with RepVGG and RCSOSA modules
backbone:
  # [from, number, module, args]
  [
    [-1, 1, RepVGG, [32, 3, 1]], # 0

    [-1, 1, RepVGG, [64, 3, 2]], # 1-P1/2
    [-1, 1, RepVGG, [64, 3, 1]],

    [-1, 1, RepVGG, [128, 3, 2]], # 3-P2/4
    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [128]], # 4
    [-1, 1, Conv, [256, 1, 1]], # 5

    [-1, 1, MP, []], # 6
    [-1, 1, Conv, [128, 1, 1]], # 7
    [-3, 1, Conv, [128, 1, 1]], # 8
    [-1, 1, RepVGG, [128, 3, 2]], # 9
    [[-1, -3], 1, Concat, [1]], # 10-P3/8
    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [256]], # 11
    [-1, 1, Conv, [512, 1, 1]], # 12

    [-1, 1, MP, []], # 13
    [-1, 1, Conv, [256, 1, 1]], # 14
    [-3, 1, Conv, [256, 1, 1]], # 15
    [-1, 1, RepVGG, [256, 3, 2]], # 16
    [[-1, -3], 1, Concat, [1]], # 17-P4/16
    # ELAN module replaced with RCSOSA
    [-1, 4, RCSOSA, [512, True]], # 18
    [-1, 1, Conv, [1024, 1, 1]], # 19

    [-1, 1, MP, []], # 20
    [-1, 1, Conv, [512, 1, 1]], # 21
    [-3, 1, Conv, [512, 1, 1]], # 22
    [-1, 1, RepVGG, [512, 3, 2]], # 23
    [[-1, -3], 1, Concat, [1]], # 24-P5/32
    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [1024, True]], # 25
    [-1, 1, Conv, [1024, 1, 1]], # 26
  ]

# yolov7 head with RepVGG and RCSOSA modules
head: [
    [-1, 1, SPPCSPC, [512]], # 27

    [-1, 1, Conv, [256, 1, 1]], # 28
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 29
    [19, 1, Conv, [256, 1, 1]], # route backbone P4  # 30
    [[-1, -2], 1, Concat, [1]], # 31

    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [256]], # 32
    [-1, 1, Conv, [256, 1, 1]], # 33

    [-1, 1, Conv, [128, 1, 1]], # 34
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 35
    [12, 1, Conv, [128, 1, 1]], # route backbone P3  # 36
    [[-1, -2], 1, Concat, [1]], # 37

    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [128]], # 38
    [-1, 1, Conv, [128, 1, 1]], # 39

    [-1, 1, MP, []], # 40
    [-1, 1, Conv, [128, 1, 1]], # 41
    [-3, 1, Conv, [128, 1, 1]], # 42
    [-1, 1, RepVGG, [128, 3, 2]], # 43
    [[-1, -3, 33], 1, Concat, [1]], # 44

    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [256]], # 45
    [-1, 1, Conv, [256, 1, 1]], # 46

    [-1, 1, MP, []], # 47
    [-1, 1, Conv, [256, 1, 1]], # 48
    [-3, 1, Conv, [256, 1, 1]], # 49
    [-1, 1, RepVGG, [256, 3, 2]], # 50
    [[-1, -3, 27], 1, Concat, [1]], # 51

    # ELAN module replaced with RCSOSA
    [-1, 2, RCSOSA, [512, True]], # 52
    [-1, 1, Conv, [512, 1, 1]], # 53

    [39, 1, RepVGG, [256, 3, 1]], # 54 - 使用RepVGG替换RepConv
    [46, 1, RepVGG, [512, 3, 1]], # 55 - 使用RepVGG替换RepConv
    [53, 1, RepVGG, [1024, 3, 1]], # 56 - 使用RepVGG替换RepConv

    [[54, 55, 56], 1, IDetect, [nc, anchors]], # Detect(P3, P4, P5)  # 57
  ]
