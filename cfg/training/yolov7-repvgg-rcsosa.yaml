# YOLOv7 with RepVGG and RCSOSA modules optimization

# parameters
nc: 2 # number of classes
depth_multiple: 1.0 # model depth multiple
width_multiple: 1.0 # layer channel multiple


anchors:
  - [87, 90, 127, 139] # P4/16 
  - [154, 171, 191, 240] # P5/32

# yolov7 backbone with RepVGG and RCSOSA modules
backbone:
  # [from, number, module, args]
  [
    [-1, 1, RepVGG, [32, 3, 1]], # 0    640*640*32

    [-1, 1, RepVGG, [64, 3, 2]], # 1-P1/2    320*320*64
    [-1, 1, RepVGG, [64, 3, 1]], #           320*320*64

    [-1, 1, RepVGG, [128, 3, 2]], # 3-P2/4   160*160*128
    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [128]], # 4   
    [-1, 1, Conv, [256, 1, 1]], # 5

    [-1, 1, MP, []], # 6
    [-1, 1, Conv, [128, 1, 1]], # 7
    [-3, 1, Conv, [128, 1, 1]], # 8
    [-1, 1, RepVGG, [128, 3, 2]], # 9
    [[-1, -3], 1, Concat, [1]], # 10-P3/8
    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [256]], # 11
    [-1, 1, Conv, [512, 1, 1]], # 12

    [-1, 1, MP, []], # 13
    [-1, 1, Conv, [256, 1, 1]], # 14
    [-3, 1, Conv, [256, 1, 1]], # 15
    [-1, 1, RepVGG, [256, 3, 2]], # 16
    [[-1, -3], 1, Concat, [1]], # 17-P4/16
    # ELAN module replaced with RCSOSA (n=4，与图中一致)
    [-1, 4, RCSOSA, [512, True]], # 18
    [-1, 1, Conv, [1024, 1, 1]], # 19

    [-1, 1, MP, []], # 20
    [-1, 1, Conv, [512, 1, 1]], # 21
    [-3, 1, Conv, [512, 1, 1]], # 22
    [-1, 1, RepVGG, [512, 3, 2]], # 23
    [[-1, -3], 1, Concat, [1]], # 24-P5/32
    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [1024, True]], # 25
    [-1, 1, Conv, [1024, 1, 1]], # 26
  ]

# yolov7 head with RepVGG and RCSOSA modules
head: [
    [-1, 1, SPPF, [512, 5, 9, 13]], # 27 - 根据图示使用SPPF替换SPPCSPC，k=(5,9,13)

    [-1, 1, Conv, [256, 1, 1]], # 28
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 29
    [19, 1, Conv, [256, 1, 1]], # route backbone P4  # 30
    [[-1, -2], 1, Concat, [1]], # 31

    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [256]], # 32
    [-1, 1, Conv, [256, 1, 1]], # 33

    [-1, 1, Conv, [128, 1, 1]], # 34
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 35
    [12, 1, Conv, [128, 1, 1]], # route backbone P3  # 36
    [[-1, -2], 1, Concat, [1]], # 37

    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [128]], # 38
    [-1, 1, Conv, [128, 1, 1]], # 39

    [-1, 1, MP, []], # 40
    [-1, 1, Conv, [128, 1, 1]], # 41
    [-3, 1, Conv, [128, 1, 1]], # 42
    [-1, 1, RepVGG, [128, 3, 2]], # 43
    [[-1, -3, 33], 1, Concat, [1]], # 44

    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [256]], # 45
    [-1, 1, Conv, [256, 1, 1]], # 46

    [-1, 1, MP, []], # 47
    [-1, 1, Conv, [256, 1, 1]], # 48
    [-3, 1, Conv, [256, 1, 1]], # 49
    [-1, 1, RepVGG, [256, 3, 2]], # 50
    [[-1, -3, 27], 1, Concat, [1]], # 51

    # ELAN module replaced with RCSOSA (n=2)
    [-1, 2, RCSOSA, [512, True]], # 52
    [-1, 1, Conv, [512, 1, 1]], # 53

    # 根据图示构建检测头连接：RCS-OSA -> RepVGG -> IDetect
    # 检测头1: 从第46层(P4特征)经过RCS-OSA再到RepVGG最后到IDetect
    [46, 2, RCSOSA, [256]], # 54 - n=2，与图中一致
    [-1, 1, RepVGG, [512, 3, 1]], # 55 - stride=1，与图中一致
    
    # 检测头2: 从第53层(P5特征)经过RCS-OSA再到RepVGG最后到IDetect
    [53, 2, RCSOSA, [512]], # 56 - n=2，与图中一致
    [-1, 1, RepVGG, [1024, 3, 1]], # 57 - stride=1，与图中一致

    [[55, 57], 1, IDetect, [nc, anchors]], # 58 - Detect(P4, P5) - 仅使用两个特征层
  ]
